<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yerdema Subs — Test Page</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #111; color: #eee; }
      main { max-width: 960px; margin: 0 auto; }
      .player { position: relative; background: #000; }
      video { width: 100%; display: block; background: #000; }
      button { margin: 12px 8px 0 0; padding: 8px 14px; border-radius: 6px; border: 0; cursor: pointer; }
      code { background: #222; padding: 2px 6px; border-radius: 4px; }
      .spacer { height: 600px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Yerdema Subs — HTML5 test page</h1>
      <p>
        Press play. English cues come from <code>sample.en.vtt</code>; the extension should show the
        Turkish translation over the video. The clip loops (~5 s, 8 cues).
      </p>
      <div class="player" id="player">
        <video id="video" controls loop muted playsinline
          src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
          <track kind="subtitles" srclang="en" label="English" src="sample.en.vtt" default />
        </video>
      </div>
      <button id="fs" type="button">Fullscreen (container)</button>
      <button id="slow" type="button">Playback 0.5×</button>
      <button id="normal" type="button">Playback 1×</button>
      <p>Scroll down to check that the overlay follows the video.</p>
      <div class="spacer"></div>
    </main>
    <script>
      const video = document.getElementById('video');
      document.getElementById('fs').onclick = () => document.getElementById('player').requestFullscreen();
      document.getElementById('slow').onclick = () => (video.playbackRate = 0.5);
      document.getElementById('normal').onclick = () => (video.playbackRate = 1);
    </script>
  </body>
</html>
